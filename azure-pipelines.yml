trigger:
- main

stages:
- stage: Dev
  pool: 'WDKubePool'
  jobs:
  - job: DeployDev
    steps:
    - checkout: self
    - task: KubernetesManifest@1
      inputs:
        kubernetesServiceConnection: 'wddev-k8s service connection'

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: 'sed -i ''s/\r$//'' ''./configure-ingress-controller.sh'''
        workingDirectory: "testportal/"
    - task: Bash@3
      inputs:
        filePath: 'testportal/configure-ingress-controller.sh'
        arguments: 'walletdoc2 ingress.yml'
        workingDirectory: "testportal/"

- stage: Staging
  pool: 'WDKubePool'
  dependsOn: Dev
  jobs:
  - job: DeployStaging
    steps:
    - checkout: self
    - task: KubernetesManifest@1
      inputs:
        kubernetesServiceConnection: 'wddev-k8s service connection'

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: 'sed -i ''s/\r$//'' ''./configure-ingress-controller.sh'''
        workingDirectory: "testportal/"
    - task: Bash@3
      inputs:
        filePath: 'testportal/configure-ingress-controller.sh'
        arguments: 'walletdoc3 ingress.yml'
        workingDirectory: "testportal/"

- stage: Prod
  pool: 'WDKubePool'
  dependsOn: Staging
  jobs:
  - job: DeployProd
    steps:
    - checkout: self
    - task: KubernetesManifest@1
      inputs:
        kubernetesServiceConnection: 'wddev-k8s service connection'

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: 'sed -i ''s/\r$//'' ''./configure-ingress-controller.sh'''
        workingDirectory: "testportal/"
    - task: Bash@3
      inputs:
        filePath: 'testportal/configure-ingress-controller.sh'
        arguments: 'walletdoc4 ingress.yml'
        workingDirectory: "testportal/"
